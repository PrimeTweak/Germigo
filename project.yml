name: Petri

options:
  bundleIdPrefix: ca.petri
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.2"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: NO

targets:
  Petri:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Petri.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Petri
        PRODUCT_BUNDLE_IDENTIFIER: ca.petri.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Petri.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconClassic AppIconNightShift AppIconTissueBox AppIconSoupBowl AppIconGoldenDish AppIconHolo"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: PetriWidgets

  PetriWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "PetriWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PetriWidgets
        PRODUCT_BUNDLE_IDENTIFIER: ca.petri.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/PetriWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  Petri:
    build:
      targets:
        Petri: all
    run:
      config: Debug
    archive:
      config: Release
