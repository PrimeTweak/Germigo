name: Germily

options:
  bundleIdPrefix: ca.germily
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.2"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: NO

targets:
  Germily:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Germily.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Germily
        PRODUCT_BUNDLE_IDENTIFIER: ca.germily.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Germily.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconDaylight AppIconNightShift AppIconSnowDay AppIconSoupBowl AppIconGolden AppIconHolo"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: GermilyWidgets

  GermilyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "GermilyWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: GermilyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: ca.germily.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/GermilyWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  Germily:
    build:
      targets:
        Germily: all
    run:
      config: Debug
    archive:
      config: Release
